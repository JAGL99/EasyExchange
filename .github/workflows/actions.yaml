on:

  push:

    branches: [ "develop" ]

  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}

jobs:

  run-unit-tests:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICE_JSON" | base64 -d > app/google-services.json
          jq empty app/google-services.json && echo "JSON syntax is valid!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Create issue if job fails
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en el workflow: ${context.workflow}`,
              body: `El job "${context.job}" falló en el commit ${context.sha}. Revisa los logs para más detalles.`,
              labels: ['bug', 'ci']
            })

  run-ui-tests:
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: |
          echo "$GOOGLE_SERVICE_JSON" | base64 -d > app/google-services.json
          jq empty app/google-services.json && echo "JSON syntax is valid!"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedCheck

      - name: Create issue if job fails
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en el workflow: ${context.workflow}`,
              body: `El job "${context.job}" falló en el commit ${context.sha}. Revisa los logs para más detalles.`,
              labels: ['bug', 'ci']
            })

  merge-develop-to-main:

    needs:
      - run-unit-tests
      - run-ui-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.ACTIONS_DEPLOY_KEY }}@github.com/JAGL99/EasyExchange.git

      - name: Merge develop into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff origin/develop -m "Merge develop into main via GitHub Actions"
          git push origin main